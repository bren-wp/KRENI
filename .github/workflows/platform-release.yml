name: KRENI · Android & iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kreni-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data integrity / journey graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Catalog / GTFS / router tests
        run: |
          python3 pipeline/validate_catalog.py
          python3 -m unittest discover -s pipeline -p 'test_*.py' -v

  android:
    name: Android · Kotlin / Compose
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          test -n "$ANDROID_HOME"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile / test / assemble
        working-directory: android
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify Android package
        run: |
          mkdir -p dist
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/KRENI-Android-v0.0.2-unsigned.apk
          test -s dist/KRENI-Android-v0.0.2-unsigned.apk
          (cd android && zip -qr ../dist/KRENI-Android-v0.0.2-source.zip . -x '*/build/*' '.gradle/*')
      - uses: actions/upload-artifact@v4
        with:
          name: kreni-android-0.0.2
          path: dist/KRENI-Android-v0.0.2-*
          if-no-files-found: error

  ios:
    name: iOS · Swift / SwiftUI
    runs-on: macos-15
    needs: data
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          (cd ios && xcodegen generate)
      - name: iOS simulator compile
        run: |
          xcodebuild -project ios/KRENI.xcodeproj -scheme KRENI -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: iOS device release
        run: |
          xcodebuild -project ios/KRENI.xcodeproj -scheme KRENI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Verify iOS package
        run: |
          mkdir -p dist
          test -d ios/build/Build/Products/Release-iphoneos/KRENI.app
          ditto -c -k --keepParent ios/build/Build/Products/Release-iphoneos/KRENI.app \
            dist/KRENI-iOS-v0.0.2-unsigned.zip
          test -s dist/KRENI-iOS-v0.0.2-unsigned.zip
          (cd ios && zip -qr ../dist/KRENI-iOS-v0.0.2-source.zip . \
            -x 'build/*' 'KRENI.xcodeproj/*' '.DS_Store')
      - uses: actions/upload-artifact@v4
        with:
          name: kreni-ios-0.0.2
          path: dist/KRENI-iOS-v0.0.2-*
          if-no-files-found: error

  release:
    name: Release v0.0.2
    runs-on: ubuntu-latest
    needs: [data, android, ios]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kreni-*-0.0.2
          path: dist
          merge-multiple: true
      - name: Verify every deliverable
        run: |
          for f in \
            dist/KRENI-Android-v0.0.2-unsigned.apk \
            dist/KRENI-Android-v0.0.2-source.zip \
            dist/KRENI-iOS-v0.0.2-unsigned.zip \
            dist/KRENI-iOS-v0.0.2-source.zip
          do
            test -s "$f"
          done
      - name: Publish pre-release only after both successful builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.2 >/dev/null 2>&1; then
            echo "v0.0.2 exists; not overwriting existing assets"
          else
            gh release create v0.0.2 \
              --target "$GITHUB_SHA" \
              --title "KRENI v0.0.2 — Android & iOS" \
              --prerelease \
              --notes-file RELEASE_NOTES.md \
              dist/KRENI-Android-v0.0.2-unsigned.apk \
              dist/KRENI-Android-v0.0.2-source.zip \
              dist/KRENI-iOS-v0.0.2-unsigned.zip \
              dist/KRENI-iOS-v0.0.2-source.zip
          fi
