name: KRENI Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kreni-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 pipeline/validate_catalog.py
          python3 pipeline/validate_live_sources.py
          python3 -m unittest discover -s pipeline -p 'test_*.py' -v

  android:
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          test -n "$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Optional production signing
        env:
          STORE_B64: ${{ secrets.KRENI_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KRENI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KRENI_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KRENI_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$STORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/kreni-release.jks"
            chmod 600 "$RUNNER_TEMP/kreni-release.jks"
            echo "KRENI_SIGNING_STORE=$RUNNER_TEMP/kreni-release.jks" >> "$GITHUB_ENV"
            echo "KRENI_SIGNING_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KRENI_SIGNING_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KRENI_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KRENI_SIGNED_RELEASE=yes" >> "$GITHUB_ENV"
          else
            echo "No distribution key. An installable test APK will be provided."
          fi
      - name: Test, APK and AAB
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify signing and package Android files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/KRENI-Android-v0.0.6-installable-test.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          if [[ "${KRENI_SIGNED_RELEASE:-}" == "yes" ]]; then
            test -s android/app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk dist/android/KRENI-Android-v0.0.6-release-signed.apk
            cp android/app/build/outputs/bundle/release/app-release.aab dist/android/KRENI-Android-v0.0.6-play-signed.aab
            jarsigner -verify -strict dist/android/KRENI-Android-v0.0.6-play-signed.aab
          else
            cp android/app/build/outputs/bundle/release/app-release.aab dist/android/KRENI-Android-v0.0.6-unsigned.aab
          fi
          zip -qr dist/android/KRENI-Android-v0.0.6-source.zip android data assets docs/BUILD.md -x 'android/**/build/*' 'android/**/.gradle/*'
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify real installation, launch and screenshot Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tool/smoke_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kreni-android-packages-0.0.6
          path: dist/android/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kreni-android-screens-0.0.6
          path: dist/screenshots/android/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [data, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kreni-android-packages-0.0.6
          path: dist/android
      - name: Verify artifacts
        run: |
          set -e
          test -s dist/android/KRENI-Android-v0.0.6-installable-test.apk
          test -s dist/android/KRENI-Android-v0.0.6-source.zip
          ls dist/android/*.aab >/dev/null
      - name: Publish immutable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.6 >/dev/null 2>&1; then
            echo "v0.0.6 exists; skipping."
          else
            gh release create v0.0.6 \
              --target main \
              --title "KRENI v0.0.6 — Android live GTFS-RT" \
              --prerelease \
              --notes-file RELEASE_NOTES.md \
              dist/android/*
          fi
