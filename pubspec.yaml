name: kreni
description: KRENI - javni prijevoz Hrvatske za Android i iOS
publish_to: none
version: 0.0.1+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_svg: ^2.2.1
  http: ^1.5.0
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/launcher.png
  adaptive_icon_background: "#071936"
  adaptive_icon_foreground: assets/brand/launcher.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#071936"
  image: assets/brand/launcher.png
  android: true
  ios: true
  android_12:
    color: "#071936"
    image: assets/brand/launcher.png
