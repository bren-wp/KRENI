name: KRENI
options:
  bundleIdPrefix: hr.brendigo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: "0.0.2"
targets:
  KRENI:
    type: application
    platform: iOS
    sources:
      - path: KRENI
      - path: ../data/catalog.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hr.brendigo.kreni
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KRENI
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - KRENITests
  KRENITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KRENITests
    dependencies:
      - target: KRENI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hr.brendigo.kreni.tests
        GENERATE_INFOPLIST_FILE: YES
